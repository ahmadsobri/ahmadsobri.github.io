
# ============================================================
# SIDEBAR NAVIGATION
# ============================================================

menu:
  - title: Home
    url: /

  - title: Blog
    url: /blog/

  - title: About
    url: /about/


# ============================================================
# SITE INFORMATION
# ============================================================

title: "Ahmad Sobri - Software Engineering Notes"
tagline: "Knowledge, Architecture, and Engineering"

description: >-
  Personal knowledge base, system design notes, software architecture,
  engineering practices, and lessons learned building software.

url: "https://ahmadsobri.github.io"
baseurl: ""
lang: en

# ============================================================
# AUTHOR
# ============================================================

author:
  name: "Ahmad Sobri"
  about: |
    Software engineer documenting system design,
    software architecture, and engineering practices.

  social:
    github: ahmadsobri

# ============================================================
# HYDEJACK THEME
# ============================================================

# Use remote_theme for GitHub Pages branch deployment.
# Do not use theme: jekyll-theme-hydejack here.

remote_theme: hydecorp/hydejack@v9

accent_color: "rgb(0, 150, 136)"
accent_image: none
theme_color: "rgb(25, 55, 71)"

# Typography
font: "Noto Sans, Helvetica, Arial, sans-serif"
font_heading: "Roboto Slab, Helvetica, Arial, sans-serif"
google_fonts: "Roboto+Slab:700|Noto+Sans:400,400i,700,700i"

# ============================================================
# DARK MODE
# ============================================================

hydejack:
  dark_mode:
    dynamic: true
    icon: true
    always: false

# ============================================================
# MARKDOWN
# ============================================================

markdown: kramdown

kramdown:
  input: GFM
  hard_wrap: false
  math_engine: mathjax

permalink: /:categories/:year/:month/:day/:title/

# ============================================================
# DEFAULT PAGE CONFIGURATION
# ============================================================

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Ahmad Sobri
      comments: false
      share: true
      related_posts: true

  - scope:
      path: ""
      type: pages
    values:
      layout: page

# ============================================================
# PLUGINS
# ============================================================

plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-seo-tag

# ============================================================
# RSS
# ============================================================

feed:
  path: feed.xml

# ============================================================
# SEO
# ============================================================

twitter:
  card: summary

# ============================================================
# EXCLUDE
# ============================================================

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - README.md
  - LICENSE
  - .gitignore
  - .github

